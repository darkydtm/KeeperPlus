name: Build signed Android release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name (YY.MM.N)
        required: true
        type: string
      version_code:
        description: Android version code
        required: true
        type: string

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Validate request and verification run
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Only main can be released' >&2; exit 1; }
          [[ "$VERSION_NAME" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]] || { echo 'Invalid version name' >&2; exit 1; }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] && (( VERSION_CODE <= 2100000000 )) || { echo 'Invalid version code' >&2; exit 1; }
          workflows=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" --jq '.workflows[] | select(.name == "Verify Android build" and .state == "active") | .id')
          [[ "$workflows" =~ ^[0-9]+$ ]] || { echo 'Expected exactly one active verification workflow' >&2; exit 1; }
          runs=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/$workflows/runs?head_sha=$GITHUB_SHA&status=success&per_page=100" | jq -r --arg sha "$GITHUB_SHA" '.[] | .workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success") | .id')
          [[ -n "$runs" ]] || { echo 'No successful verification for this main SHA' >&2; exit 1; }

  build:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      build_attempt: ${{ steps.identity.outputs.attempt }}
    permissions:
      contents: read
      packages: read
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Configure dependency credentials
        env:
          GH_PACKAGE_TOKEN: ${{ github.token }}
        run: |
          umask 077
          printf 'GITHUB_USER=%s\nGITHUB_TOKEN=%s\n' "$GITHUB_ACTOR" "$GH_PACKAGE_TOKEN" > local.properties
      - name: Decode signing key
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}/android-release.keystore
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" && -n "$ANDROID_RELEASE_STORE_PASSWORD" && -n "$ANDROID_RELEASE_KEY_ALIAS" && -n "$ANDROID_RELEASE_KEY_PASSWORD" && -n "$CERT_SHA256" ]]
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_RELEASE_KEYSTORE"
          [[ -s "$ANDROID_RELEASE_KEYSTORE" ]]
      - name: Build signed APK
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}/android-release.keystore
        run: |
          ./gradlew -q :apps:wallet:instance:main:assembleSiteRelease \
            -PisApk=true --no-daemon --no-build-cache --no-configuration-cache \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dfile.encoding=UTF-8" \
            -Pkotlin.daemon.jvmargs=-Xmx3g
      - name: Verify and package outputs
        env:
          CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find apps/wallet/instance/main/build/outputs/apk/site/release -type f -name '*.apk' -print0)
          [[ ${#apks[@]} -eq 1 ]] || { echo 'Expected exactly one APK' >&2; exit 1; }
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)
          apksigner="$ANDROID_HOME/build-tools/$build_tools/apksigner"
          aapt="$ANDROID_HOME/build-tools/$build_tools/aapt"
          "$apksigner" verify --verbose --print-certs "${apks[0]}" > "$RUNNER_TEMP/apk-signature.txt"
          fingerprint=$(grep '^Signer #1 certificate SHA-256 digest: ' "$RUNNER_TEMP/apk-signature.txt" | cut -d ' ' -f 6 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          expected=$(printf '%s' "$CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')
          [[ "$expected" =~ ^[0-9A-F]{64}$ && "$fingerprint" == "$expected" ]]
          [[ $(grep -c '^Signer #[0-9]* certificate SHA-256 digest:' "$RUNNER_TEMP/apk-signature.txt") -eq 1 ]]
          package_info=$("$aapt" dump badging "${apks[0]}" | grep '^package: ')
          [[ "$package_info" == "package: name='com.ton_keeper' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"* ]]
          mapping=apps/wallet/instance/main/build/outputs/mapping/siteRelease/mapping.txt
          [[ -s "$mapping" ]]
          mkdir -p release
          cp "${apks[0]}" release/Keeper.apk
          cp "$mapping" release/mapping.txt
          printf 'commit=%s\nversion_name=%s\nversion_code=%s\nrun_id=%s\nrun_attempt=%s\n' "$GITHUB_SHA" "$VERSION_NAME" "$VERSION_CODE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > release/metadata.txt
          (cd release && sha256sum Keeper.apk mapping.txt metadata.txt > SHA256SUMS)
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.keystore" local.properties
      - name: Record build attempt
        id: identity
        run: printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload intermediate artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-android-intermediate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error

  delivery:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
      BUILD_ATTEMPT: ${{ needs.build.outputs.build_attempt }}
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" | python3 tools/ci/verify_release_artifact.py artifact
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ env.ARTIFACT_ID }}
          path: release
          merge-multiple: true
      - name: Verify checksums and metadata
        run: |
          set -euo pipefail
          python3 tools/ci/verify_release_artifact.py metadata
      - name: Upload final artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-android-${{ inputs.version_name }}-${{ inputs.version_code }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
