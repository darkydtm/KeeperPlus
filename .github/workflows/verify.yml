name: Verify Android build

on:
  push:
    branches-ignore:
      - main
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  compile:
    name: Compile debug Kotlin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure dependency credentials
        run: |
          printf 'GITHUB_USER=%s\nGITHUB_TOKEN=%s\n' "$GITHUB_ACTOR" "$GITHUB_TOKEN" > local.properties
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile debug Kotlin
        run: ./gradlew -q :apps:wallet:instance:app:compileDebugKotlin --no-daemon
