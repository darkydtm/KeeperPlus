name: Verify Android build

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate Android localization resources
        run: python3 tools/locales.py --platform android --res apps/wallet/localization/src/main/res validate

  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: true
      - name: Configure package access
        env:
          PACKAGE_TOKEN: ${{ github.token }}
        run: |
          umask 077
          printf 'GITHUB_USER=%s\nGITHUB_TOKEN=%s\n' "$GITHUB_ACTOR" "$PACKAGE_TOKEN" > local.properties
      - name: Run Android host tests
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/android-untrusted
        run: |
          ./gradlew -q --no-configuration-cache :kmp:mvi:testAndroidHostTest || {
            echo '::error::Gradle failed; GitHub Packages dependencies require access to both configured repositories.'
            exit 1
          }
      - name: Require executed host tests
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path('kmp/mvi/build/test-results/testAndroidHostTest').glob('TEST-*.xml'))
          executed = 0
          for report in reports:
              root = ET.parse(report).getroot()
              executed += sum(1 for case in root.iter('testcase') if case.find('skipped') is None)
          if executed == 0:
              raise SystemExit('::error::No executed Android host tests found in JUnit XML reports')
          print(f'Android host tests executed: {executed}')
          PYTEST
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: junit-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: warn
      - name: Remove credentials
        if: always()
        run: rm -f local.properties

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
      - name: Configure package access without secrets
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        env:
          PACKAGE_TOKEN: ${{ github.token }}
        run: |
          umask 077
          printf 'GITHUB_USER=%s\nGITHUB_TOKEN=%s\n' "$GITHUB_ACTOR" "$PACKAGE_TOKEN" > local.properties
      - name: Configure trusted push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PACKAGE_TOKEN: ${{ github.token }}
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_STORE_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
          DEBUG_CERT_SHA256: ${{ secrets.DEBUG_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          for name in PACKAGE_TOKEN ANDROID_DEBUG_KEYSTORE ANDROID_DEBUG_STORE_PASSWORD ANDROID_DEBUG_KEY_ALIAS ANDROID_DEBUG_KEY_PASSWORD DEBUG_CERT_SHA256; do
            if [ -z "${!name}" ]; then
              echo "::error::Required trusted-push credential $name is missing"
              exit 1
            fi
          done
          printf 'GITHUB_USER=%s\nGITHUB_TOKEN=%s\n' "$GITHUB_ACTOR" "$PACKAGE_TOKEN" > local.properties
          printf '%s' "$ANDROID_DEBUG_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/debug-signing-key"
      - name: Assemble trusted debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ runner.temp }}/debug-signing-key
          ANDROID_DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_STORE_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          ./gradlew -q --no-configuration-cache :apps:wallet:instance:main:assembleSiteDebug || {
            echo '::error::Gradle failed; GitHub Packages dependencies require access to both configured repositories.'
            exit 1
          }
      - name: Assemble untrusted debug APK
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/android-untrusted
        run: |
          ./gradlew -q --no-configuration-cache :apps:wallet:instance:main:assembleSiteDebug || {
            echo '::error::Gradle failed; GitHub Packages dependencies require access to both configured repositories.'
            exit 1
          }
      - name: Verify debug APK identity and signing certificate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEBUG_CERT_SHA256: ${{ secrets.DEBUG_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk_dir=apps/wallet/instance/main/build/outputs/apk/site/debug
          mapfile -t apks < <(find "$apk_dir" -type f -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo '::error::Expected exactly one site debug APK'
            exit 1
          fi
          tools="$ANDROID_HOME/build-tools/37.0.0"
          package=$("$tools/aapt" dump badging "${apks[0]}" | grep -o "^package: name='[^']*'" | cut -d "'" -f 2)
          if [ "$package" != com.ton_keeper.debug ]; then
            echo '::error::Unexpected APK package name'
            exit 1
          fi
          fingerprint=$("$tools/apksigner" verify --print-certs "${apks[0]}" | grep '^Signer #1 certificate SHA-256 digest:' | cut -d: -f2- | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          expected=$(printf '%s' "$DEBUG_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          if [[ ! "$expected" =~ ^[0-9A-F]{64}$ ]] || [ "$fingerprint" != "$expected" ]; then
            echo '::error::APK signing certificate does not match DEBUG_CERT_SHA256'
            exit 1
          fi
      - name: Upload trusted debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: site-debug-apk
          path: apps/wallet/instance/main/build/outputs/apk/site/debug/*.apk
          if-no-files-found: error
      - name: Remove credentials
        if: always()
        run: rm -f local.properties "$RUNNER_TEMP/debug-signing-key"

  gate:
    if: always()
    needs: [quality, host-tests, android]
    runs-on: ubuntu-latest
    steps:
      - name: Require Android verification
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          HOST_TESTS_RESULT: ${{ needs.host-tests.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          if [ "$QUALITY_RESULT" != success ] || [ "$HOST_TESTS_RESULT" != success ] || [ "$ANDROID_RESULT" != success ]; then
            echo "::error::Verification results: quality=$QUALITY_RESULT host-tests=$HOST_TESTS_RESULT android=$ANDROID_RESULT"
            exit 1
          fi
